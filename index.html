  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background-color: #f9f9f9;
      color: #333;
    }
    
    .top-nav ul {
      list-style: none;

      margin: 0;

      transition: color 0.3s;

    .top-nav ul li a.active {

    }

    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
      text-align: center;
    }

    .intro-text {

    }

    .images {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-top: 50px;
    }

    .images img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0px 6px 12px rgba(0,0,0,0.15);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    footer {
      text-align: center;
      padding: 25px 0;

      margin-top: 50px;
